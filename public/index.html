<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="도서관 좌석">
  <title>도서관 좌석</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/assets/manifest.webmanifest">
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <div class="page">
    <header><a class="brand" href="/">도서관 좌석</a><span class="school">건국대학교</span></header>
    <div id="demo-banner" class="notice" hidden>데모 · 실제 예약은 발생하지 않습니다.</div>
    <div id="offline" class="notice warning" role="status" hidden>연결 끊김 · 표시된 정보가 최신이 아닐 수 있습니다.</div>
    <main>
      <section id="access" class="access card" hidden>
        <h1>도서관 로그인</h1>
        <form id="access-form">
          <div id="direct-fields">
            <label for="login-id">아이디 / 학번</label><input id="login-id" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="256" required>
            <label for="login-password">비밀번호</label><input id="login-password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
            <label class="check-label" for="remember"><input id="remember" type="checkbox" checked>자동로그인</label>
            <p class="fine">선택하면 로그인 정보를 암호화해 저장하고, 인증 만료 시 다시 로그인합니다.</p>
          </div>
          <div id="local-fields" hidden><label for="access-password">웹앱 비밀번호</label><input id="access-password" type="password" autocomplete="current-password" minlength="16" disabled></div>
          <p id="login-error" class="inline-error" role="alert" hidden></p>
          <button id="login-submit" class="primary" type="submit">로그인</button>
        </form>
      </section>
      <div id="dashboard" hidden>
        <div class="toolbar"><div><span id="status-badge" class="badge">연결 필요</span><span id="interval" class="fine"></span></div><button id="refresh" class="secondary">새로고침</button></div>
        <p id="updated" class="fine updated">조회 전</p>
        <p id="service-error" class="notice warning" role="status" hidden></p>
        <section id="connection" class="card" hidden><h2>다시 로그인해 주세요</h2><button id="reconnect" class="primary">로그인</button><form id="connection-form" class="connection-form" hidden><div><label for="library-id">아이디 / 학번</label><input id="library-id" autocomplete="username" required></div><div><label for="library-password">비밀번호</label><input id="library-password" type="password" autocomplete="current-password" required></div><button id="connect" class="primary" type="submit">로그인</button></form></section>
        <section id="reservation" class="card reservation" hidden><div class="section-heading"><h2>내 좌석</h2><span id="reservation-badge" class="badge"></span></div><p id="reservation-seat" class="seat-display"></p><p id="reservation-time" class="muted"></p><p id="reservation-guide" class="fine"></p><button id="release" class="secondary danger">예약 취소</button></section>
        <section class="seats-section"><div class="section-heading"><h2>좌석</h2><span id="selection-count" class="fine">0개 선택</span></div><div class="tabs" role="group" aria-label="열람실"><button class="tab active" data-room="102" aria-pressed="true">1열람실 A</button><button class="tab" data-room="101" aria-pressed="false">1열람실 B</button></div><div class="legend"><span><i class="dot free"></i>빈자리</span><span><i class="dot occupied"></i>사용 중</span><span><i class="dot chosen"></i>선택</span></div><div id="seats" class="seat-grid"></div><p id="empty-seats" class="empty">로그인 후 좌석을 확인할 수 있습니다.</p></section>
        <details class="history card"><summary>최근 활동</summary><ol id="events"></ol><p id="empty-events" class="fine">기록 없음</p></details>
        <footer><p>임시배정 후 현장에서 공식 앱으로 NFC 인증을 완료해야 합니다.</p><div><span id="auto-login-status"></span><button id="disconnect" class="text-button">연결 해제</button><button id="logout" class="text-button">이 기기 로그아웃</button></div></footer>
        <div class="action-bar"><strong id="action-title">좌석을 선택하세요</strong><button id="start-stop" class="primary">자동 예약 시작</button></div>
      </div>
    </main>
  </div>
  <div id="toast" role="status" hidden></div>
  <dialog id="confirm-dialog"><form method="dialog"><h2 id="confirm-title"></h2><p id="confirm-message"></p><div class="dialog-actions"><button class="secondary" value="cancel">취소</button><button class="primary" value="confirm">확인</button></div></form></dialog>
</body>
</html>
